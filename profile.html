<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - OP Studio</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<script>
    if (
        localStorage.getItem("opsDarkMode") === "true"
    ) {
        document.body.classList.add("dark");
        document.documentElement.style.colorScheme = "dark";
    }
</script>

    <main class="profile-page">

        <div class="profile-header">

            <div class="profile-back-actions">

    <button
        id="backToTypingBtn"
        class="profile-back-btn"
        type="button">
        ← Typing
    </button>

    <button
        id="backToDatabaseBtn"
        class="profile-back-btn"
        type="button">
        ← Database
    </button>

</div>

            <section id="profileHeader">
<h1 id="profileUsername">Loading profile...</h1>

<div id="profileBio"></div>

<button
    id="editProfileBtn"
    type="button"
    style="display: none;">
    Edit Profile
</button>

<div id="profileBioEditor" style="display: none;">

    <input
        id="profileUsernameInput"
        type="text"
        placeholder="Username"
        maxlength="50">

    <textarea
        id="profileBioInput"
        placeholder="Write something about yourself..."
        maxlength="500"></textarea>

    <button id="saveProfileBtn" type="button">
        Save
    </button>

    <button id="cancelProfileEditBtn" type="button">
        Cancel
    </button>

</div>

            <div id="profileStatus"></div>

            <div class="profile-stats">

                <div class="profile-stat">
                    <strong id="profileTypingCount">0</strong>
                    <span>Typings</span>
                </div>

                <div class="profile-stat">
                    <strong id="profileFollowerCount">0</strong>
                    <span>Followers</span>
                </div>

                <div class="profile-stat">
                    <strong id="profileFollowingCount">0</strong>
                    <span>Following</span>
                </div>

            </div>

            <button id="profileFollowBtn" type="button">
    Follow
</button>

<button id="profileMessageBtn" type="button">
    Message
</button>

<button id="profileMuteBtn" type="button">
    Mute
</button>

<button id="profileBlockBtn" type="button">
    Block
</button>

<button id="profileTypingNotifyBtn" type="button">
    Typing Notifications
</button>

</section>

</div>

<section class="profile-typings-section">

    <h2>Published Typings</h2>

    <div class="profile-typing-controls">

        <div class="profile-typing-search-row">

            <input
                id="profileTypingSearch"
                type="search"
                placeholder="Search typings...">

            <select id="profileTypingSort">
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="title-asc">Title A–Z</option>
                <option value="title-desc">Title Z–A</option>
            </select>

        </div>

        <div class="profile-typing-filter-row">

            <select id="profileTypingTypeFilter">
                <option value="all">
                    All Types
                </option>
            </select>

            <select id="profileTypingPossibilitiesFilter">
                <option value="all">
                    All Result Counts
                </option>
                <option value="1">1 Result</option>
                <option value="2-5">2–5 Results</option>
                <option value="6-10">6–10 Results</option>
                <option value="11-20">11–20 Results</option>
                <option value="21+">21+ Results</option>
            </select>

            <select id="profileTypingDateFilter">
                <option value="all">
                    Any Date
                </option>
                <option value="today">Today</option>
                <option value="week">
                    Past Week
                </option>
                <option value="month">
                    Past Month
                </option>
                <option value="year">
                    Past Year
                </option>
            </select>

            <button
                id="clearProfileTypingFilters"
                type="button">
                Clear Filters
            </button>

            <button
                id="profileRevealAllTypes"
                type="button">
                Reveal All Types
            </button>

        </div>

    </div>

    <div id="profileTypings">
        Loading typings...
    </div>

</section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/profile.js"></script>

</body>
</html>
