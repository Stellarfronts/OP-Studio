<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Database - OP Studio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
    <div class="app-brand">
        OP Studio
    </div>

    <div class="header-main">
        <div class="page-title">Public Database</div>
    </div>

    <div class="header-actions">
        <a class="header-link-btn" href="/">Back to typing tool</a>
    </div>
</header>

<main class="database-page">
    <section class="database-card">
        <div class="database-card-header">
            <h1>Published Typings</h1>
            <p>Browse public typing entries shared from the studio.</p>
        </div>
        <div id="databaseEntries" class="database-entry-list">Loading public entries…</div>
    </section>
</main>

<script src="js/database.js"></script>
</body>
</html>
