<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Database - OP Studio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
    <div class="app-brand">
        OP Studio
    </div>

    <div class="header-main">
        <div class="page-title">Public Database</div>
    </div>

    <div class="header-actions">
        <div id="viewModeControls" class="view-mode-controls" style="display: none;">
    <span id="viewModeLabel">Viewing Published Typing</span>
    <button id="backToDatabaseBtn" type="button">← Back to Database</button>
    <button id="duplicateTypingBtn" type="button">Copy to My Saved Typings</button>
</div>
<a class="header-link-btn" href="index.html">Back to typing tool</a>
    </div>
</header>

<button id="notificationsBtn" type="button">
    Notifications
    <span id="notificationBadge" class="notification-badge" style="display: none;">0</span>
</button>

<div id="notificationsPanel" class="notifications-panel">

    <div class="notifications-panel-header">
        <h2>Notifications</h2>

        <button
            id="closeNotificationsBtn"
            type="button">
            ×
        </button>
    </div>

    <div id="notificationsList" class="notifications-list">
        Loading notifications...
    </div>

</div>

<main class="database-page">
    <section class="database-card">
        <div class="database-card-header">
            <h1>Published Typings</h1>
            <p>Browse public typing entries shared from the studio.</p>
        </div>
       <div class="database-toolbar">

    <div class="database-search-row">
        <input
            id="databaseSearch"
            type="text"
            placeholder="Search usernames or titles...">

        <select id="databaseSort">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="username-asc">Username A–Z</option>
            <option value="username-desc">Username Z–A</option>
            <option value="title-asc">Title A–Z</option>
            <option value="title-desc">Title Z–A</option>
        </select>
    </div>

    <div class="database-filters">

        <select id="databaseTypeFilter">
            <option value="all">All Types</option>
        </select>

        <select id="databasePossibilitiesFilter">
            <option value="all">All Result Counts</option>
            <option value="1">1 result</option>
            <option value="2-5">2–5 results</option>
            <option value="6-10">6–10 results</option>
            <option value="11-20">11–20 results</option>
            <option value="21+">21+ results</option>
        </select>

        <select id="databaseDateFilter">
            <option value="all">Any Date</option>
            <option value="today">Today</option>
            <option value="week">Past Week</option>
            <option value="month">Past Month</option>
            <option value="year">Past Year</option>
        </select>

        <button
            id="clearDatabaseFilters"
            type="button">
            Clear Filters
        </button>

    </div>

</div>
        <div id="databaseEntries" class="database-entry-list">Loading public entries…</div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/database.js"></script>
</body>
</html>
