<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Database - OP Studio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<script>
    if (
        localStorage.getItem("opsDarkMode") === "true"
    ) {
        document.body.classList.add("dark");
        document.documentElement.style.colorScheme = "dark";
    }
</script>
<header class="app-header">
    <div class="app-brand">
        OP Studio
    </div>

    <div class="header-main">
        <div class="page-title">Public Database</div>
    </div>

    <div class="header-actions">
        <div id="viewModeControls" class="view-mode-controls" style="display: none;">
    <span id="viewModeLabel">Viewing Published Typing</span>
    <button id="backToDatabaseBtn" type="button">← Back to Database</button>
    <button id="duplicateTypingBtn" type="button">Copy to My Saved Typings</button>
</div>
<a class="header-link-btn" href="index.html">Back to typing tool</a>
    </div>
</header>

<main class="database-page">
    <section class="database-card">

        <div class="database-content-tabs">
            <button
                id="databaseTypingsTab"
                class="database-content-tab active"
                type="button">
                Typings
            </button>

            <button
                id="databaseDefinitionsTab"
                class="database-content-tab"
                type="button">
                Definitions
            </button>
        </div>

        <div class="database-card-header">
        </div>
       <div class="database-toolbar">

    <div class="database-search-row">
        <input
            id="databaseSearch"
            type="text"
            placeholder="Search usernames or titles...">

        <select id="databaseSort">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="username-asc">Username A–Z</option>
            <option value="username-desc">Username Z–A</option>
            <option value="title-asc">Title A–Z</option>
            <option value="title-desc">Title Z–A</option>
        </select>
    </div>

    <div class="database-filters">

        <select id="databaseTypeFilter">
            <option value="all">All Types</option>
        </select>

        <select id="databaseDateFilter">
            <option value="all">Any Date</option>
            <option value="today">Today</option>
            <option value="week">Past Week</option>
            <option value="month">Past Month</option>
            <option value="year">Past Year</option>
        </select>

<button
    id="databaseBookmarkFilter"
    type="button"
    data-active="false">
    Bookmarks
</button>

        <button
            id="clearDatabaseFilters"
            type="button">
            Clear Filters
        </button>

    </div>

</div>

        <div id="typingsDatabaseSection">
            <div
                id="databaseEntries"
                class="database-entry-list">
                Loading public entries…
            </div>
        </div>

<div
    id="definitionsDatabaseSection"
    style="display: none;">

    <div
        id="definitionEntries"
        class="database-entry-list">
        Loading public definitions…
    </div>

</div>

    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/database.js"></script>
</body>
</html>
