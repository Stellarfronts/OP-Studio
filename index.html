<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Checklist Studio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">

    <div class="app-brand">
        OP Studio
    </div>

    <div class="header-main">

        <span id="viewModeLabel" style="display: none;">
            👁 Viewing Published Typing
        </span>

<textarea
    id="templateTitle"
    class="title-input"
    placeholder="Title"
    rows="1"
    spellcheck="true"
></textarea>

    </div>

    <div class="header-actions">

        <button id="clearBtn" type="button">Clear All</button>
        <button id="themeBtn" type="button">Dark</button>
        <button id="lockBtn" type="button">Lock</button>
        <button id="databaseBtn" type="button">Database</button>
       <button id="publishBtn" type="button">Publish</button>

<button id="newTemplateBtn" type="button">New</button>

        <button id="backToDatabaseBtn" type="button" style="display: none;">
            ← Back to Database
        </button>

        <button id="duplicateTypingBtn" type="button" style="display: none;">
            Copy
        </button>

        <button id="projectsBtn" type="button">Saved Typings</button>
<button 
    id="notificationsPageBtn" 
    type="button" 
    aria-label="Notifications" 
    title="Notifications" 
> 
    <svg 
        class="notification-bell-icon" 
        viewBox="0 0 24 24" 
        aria-hidden="true"
    > 
        <path 
            d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" 
        /> 
    </svg> 
</button>

<button
    id="settingsBtn"
    type="button"
    aria-label="Settings"
    title="Settings"
>
    <svg
        class="settings-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
    >
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.09A1.7 1.7 0 0 0 8.97 19.35a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3v-4h.09A1.7 1.7 0 0 0 4.65 8.94a1.7 1.7 0 0 0-.34-1.88L4.25 7l2.83-2.83.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 10.05 3H10V3h4v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06L19.8 7l-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.03H21v4h-.09A1.7 1.7 0 0 0 19.4 15z"></path>
    </svg>
</button>

<button id="accountBtn" type="button">Account</button>

    </div>

</header>

    <div id="projectsMenu" class="projects-menu"></div>

<div id="settingsMenu" class="settings-menu">
    <div class="settings-menu-title">Settings</div>

    <div class="settings-row">
        <div class="settings-label-group">
            <strong>Coin Selection</strong>
            <span>Choose how coin sides are selected.</span>
        </div>

        <select id="coinSelectionMode">
            <option value="simple">Simple Click</option>
            <option value="precise">Precise</option>
        </select>
    </div>
</div>

    <div
    id="notificationsMenu"
    class="projects-menu">
</div>

<div id="accountMenu" class="account-menu">
    <div><strong>Account</strong></div>

    <input id="accountEmailInput" type="email" placeholder="Email address">

    <input id="accountUsernameInput"
       type="text"
       placeholder="Username">

<div class="password-wrapper">
    <input id="accountPasswordInput" 
           type="password" 
           placeholder="Password">

    <button id="showPasswordBtn" type="button">👁</button>
</div>

    <button id="createAccountBtn" type="button">
        Create Account
    </button>

    <button id="loginAccountBtn" type="button">
        Login
    </button>

<button id="googleLoginBtn" type="button">
    Continue with Google
</button>

    <button id="logoutAccountBtn" type="button">
        Logout
    </button>

<button id="changeAccountBtn" type="button">
    Change Username
</button>

<button id="saveUsernameBtn" type="button">
    Save Username
</button>

    <div id="accountStatus" class="status"></div>
</div>

<div id="viewModeBanner" class="view-mode-banner" style="display:none;">

</div>

    <main class="app-shell">
        <aside class="sidebar results-panel">
           <div class="sidebar-title-row"></div>


               <button
        id="youtubeToggleBtn"
        class="youtube-control-btn youtube-toggle-btn"
        type="button"
        aria-label="Turn YouTube off"
        title="Turn YouTube off"
    >
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v9"></path>
            <path d="M7.1 5.7a8 8 0 1 0 9.8 0"></path>
        </svg>
    </button>
    
<div
    id="youtubePlayer"
    class="youtube-player"
>
    <iframe
        id="youtubeIframe"
        src="about:blank"
        title="YouTube player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
    ></iframe>

    <button
        id="youtubeBrowseBtn"
        class="youtube-browse-btn"
        type="button"
        aria-label="Search YouTube"
        title="Search YouTube"
    >
        <svg
            class="youtube-search-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M16 16l5 5"></path>
        </svg>
    </button>

    <div
        id="youtubeBrowsePanel"
        class="youtube-browse-panel"
    >
<div class="youtube-browse-header">

    <input
        id="youtubeSearchInput"
        type="search"
        name="youtube-search-query"
        placeholder="Search / paste link"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
    >

    <button
        id="youtubeExpandBtn"
        class="youtube-control-btn youtube-expand-btn"
        type="button"
        aria-label="Expand YouTube"
        title="Expand YouTube"
    >
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3H3v5"></path>
            <path d="M16 3h5v5"></path>
            <path d="M8 21H3v-5"></path>
            <path d="M16 21h5v-5"></path>
        </svg>
    </button>

</div>

        <div class="youtube-browse-results"></div>
    </div>
</div>

            <div id="imageUploadArea" class="results-photo-area" aria-label="Person image placeholder">
                <input id="imageFileInput" type="file" accept="image/*" multiple hidden>
                <div id="imagePlaceholder" class="results-photo-placeholder">Add image</div>
                <div id="imagePreviewContainer" class="image-preview-container"></div>
                <button id="addImageBtn" class="add-image-btn" type="button">＋ Add image</button>
            </div>
            <div id="resultsList" class="results-list"></div>
        </aside>

        <section class="center-panel">
            <div class="center-top-stats">
                <div id="matchingCount" class="count-pill">
                    <span id="typesRemaining">0 Types</span>
                    <span id="typesEliminated">0% Eliminated</span>
                </div>
                <div class="progress-bar"><span id="progressFill"></span></div>
                <div id="typingPreview" class="typing-preview">XX Xx/Xx XX/X(X) #x</div>
            </div>
            <div id="coinContainer" class="coin-container"></div>
        </section>

        <aside class="sidebar notes-panel">
            <div class="notes-header">
                <h2>Notes</h2>
                <button id="bulletBtn" class="notes-bullet-btn" type="button">•</button>
            </div>
            <textarea id="notesArea" placeholder="Type your notes here..."></textarea>
        </aside>
    </main>

    <div id="popupOverlay" class="popup-overlay">

    <div id="popupBox" class="popup-box">

        <h2 id="popupTitle"></h2>

        <p id="popupMessage"></p>

        <div id="popupButtons" class="popup-buttons"></div>

    </div>

</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

<script src="js/supabase.js"></script>

   <script src="https://www.youtube.com/iframe_api"></script>

   <script src="js/script.js?v=3"></script>
</body>
</html>
